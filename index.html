<!doctype html>
<html lang="id">

    <meta charset="utf-8" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#050816;
        --surface:#191F2C;
        --border:#232D40;
        --text:#F2F3F4;
        --muted:#9AA3AD;
        --teal:#2DD4BF;
        --teal-bg:#12332F;
        --amber:#F2B45A;
        --amber-bg:#3A2C14;
        --slate:#7FB3E0;
        --slate-bg:#1C2E42;
        --violet:#A78BFA;
        --violet-bg:#2A2140;
        --rose:#FB7185;
        --rose-bg:#3D1420;
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0}
      body{
        font-family:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background:var(--bg);
        color:var(--text);
        -webkit-font-smoothing:antialiased;
        line-height:1.5;
      }
      #bg-net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
      .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:40px 20px 48px}
      @media(min-width:720px){ .wrap{padding:64px 24px} }

      h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:800;margin:0 0 24px;text-align:center}

      .list{display:flex;flex-direction:column;gap:10px}
      .card{
        display:flex;gap:14px;align-items:center;
        background:var(--surface);border:1px solid var(--border);border-radius:14px;
        padding:16px 18px;text-decoration:none;color:inherit;
        transition:border-color .15s ease;
        min-height:44px;
      }
      .card:hover{border-color:var(--muted)}
      .card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
      .card:active{opacity:.85}

      .icon{
        flex:0 0 auto;width:42px;height:42px;border-radius:10px;
        display:grid;place-items:center;
      }
      .icon svg{width:21px;height:21px}
      .icon--teal{background:var(--teal-bg);color:var(--teal)}
      .icon--amber{background:var(--amber-bg);color:var(--amber)}
      .icon--slate{background:var(--slate-bg);color:var(--slate)}
      .icon--violet{background:var(--violet-bg);color:var(--violet)}
      .icon--rose{background:var(--rose-bg);color:var(--rose)}

      .body{flex:1;min-width:0}
      .domain{
        font-family:"JetBrains Mono", ui-monospace, monospace;
        font-size:16px;font-weight:600;color:var(--text);
        word-break:break-all;
      }
      .arrow{flex:0 0 auto;width:18px;height:18px;color:var(--muted)}

      /* Grup lipat (akordeon) */
      .group + .group{margin-top:26px}
      .group-head{
        display:flex;align-items:center;gap:8px;
        width:100%;padding:6px 2px 12px;
        background:none;border:0;cursor:pointer;
        font:inherit;color:inherit;text-align:left;
      }
      .group-head:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
      .group-title{
        font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
        color:var(--muted);
      }
      .badge{
        font-size:12px;font-weight:700;line-height:1;
        background:var(--border);color:var(--muted);
        border-radius:999px;padding:4px 8px;
      }
      .chev{
        margin-left:auto;flex:0 0 auto;width:18px;height:18px;color:var(--muted);
        transition:transform .25s ease;
      }
      .group-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
      .group-body > .list{overflow:hidden;min-height:0}
      .group.closed .group-body{grid-template-rows:0fr}
      .group.closed .chev{transform:rotate(-90deg)}
    </style>
  </head>
  <body>

    <script>
      document.querySelectorAll('[data-group]').forEach(function (g) {
        var btn = g.querySelector('.group-head');
        btn.addEventListener('click', function () {
          var closed = g.classList.toggle('closed');
          btn.setAttribute('aria-expanded', String(!closed));
        });
      });

      // Jaring partikel (plexus) ala panel D33MzVPNs — latar #050816
      (function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var cv = document.getElementById('bg-net');
        var ctx = cv.getContext('2d');
        var W, H, pts = [];
        var LINK = 130, COUNT = 70;
        function resize() {
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth; H = window.innerHeight;
          cv.width = W * dpr; cv.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        function init() {
          pts = [];
          for (var i = 0; i < COUNT; i++) {
            pts.push({
              x: Math.random() * W, y: Math.random() * H,
              vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
              r: 1 + Math.random() * 1.6
            });
          }
        }
        function step() {
          ctx.clearRect(0, 0, W, H);
          for (var i = 0; i < pts.length; i++) {
            var p = pts[i];
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > W) p.vx *= -1;
            if (p.y < 0 || p.y > H) p.vy *= -1;
            for (var j = i + 1; j < pts.length; j++) {
              var q = pts[j], dx = p.x - q.x, dy = p.y - q.y;
              var d = Math.sqrt(dx * dx + dy * dy);
              if (d < LINK) {
                var a = (1 - d / LINK) * .35;
                ctx.strokeStyle = 'rgba(120,160,220,' + a.toFixed(3) + ')';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
              }
            }
            ctx.fillStyle = 'rgba(90,140,220,.8)';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
          }
          requestAnimationFrame(step);
        }
        resize(); init(); step();
        window.addEventListener('resize', function () { resize(); init(); });
      })();
    </script>
